aid: aino-world-inc
name: Aino World Inc.
description: >-
  Aino World Inc. builds Aino, an AI-powered spatial analytics platform for
  architecture, urban planning, and real estate development teams. Aino
  automates site research by pulling zoning, parcel, transit, demographic, and
  environmental data from 10+ sources (Google Maps, Regrid, Rentcast,
  OpenStreetMap, Overture Maps, Microsoft Planetary Computer, Kontur.io, and the
  US Census), runs GIS-free spatial analysis, and generates presentation-ready
  maps and dashboards inside a shared, collaborative workspace. Coverage spans
  400+ cities with thousands of reusable data layers and CAD/GeoJSON (DXF)
  exports. Backed by 500 Global. Programmatic API access is offered on the
  enterprise Business tier.
